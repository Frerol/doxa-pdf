name: Feature request
description: Suggest an idea for Doxa PDF
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the study or reading situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / how other apps do it
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Android, Windows, Linux, All]
