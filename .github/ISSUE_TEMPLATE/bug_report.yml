name: Bug report
description: Something does not work as expected
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please do not attach private documents. If the bug needs a specific PDF, share one that is safe to publish.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Also describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Select the highlighter …\n3. …"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Android, Windows, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Doxa PDF version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / OS version / input device
      placeholder: "e.g. Galaxy Tab S9, Android 15, S Pen"
  - type: checkboxes
    id: dataloss
    attributes:
      label: Severity
      options:
        - label: This caused data loss or a corrupted file
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From Settings → About → Report a problem, if available.
      render: text
