name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  flutter:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - name: Format, analyze and test the workspace
        env:
          DOXA_FORBIDDEN_NAMES: ${{ secrets.DOXA_FORBIDDEN_NAMES }}
        run: tools/check.sh
      - name: Drift code and schemas up to date
        working-directory: app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run drift_dev make-migrations
          git diff --exit-code -- . ':!pubspec.lock'
          test -z "$(git status --porcelain -- .)"
      - name: Test repository checks and check pub dependency licenses
        run: |
          python3 -B -m unittest discover -s tools -p 'test_check_dependency_licenses.py'
          python3 -B -m unittest discover -s tools -p 'test_check_repo_rules.py'
          python3 -B -m unittest discover -s tools -p 'test_build_dictionary.py'
          python3 -B -m unittest discover -s tools -p 'test_version_code.py'
          python3 -B -m unittest discover -s tools -p 'test_generate_sbom.py'
          python3 tools/version_code.py --check
          python3 tools/check_dependency_licenses.py pub
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: |
            app/coverage/lcov.info
            packages/*/coverage/lcov.info
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - name: Fetch Android PDFium
        run: tools/fetch_pdfium.sh android
      - name: Install the pinned Android SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'ndk;28.2.13676358'
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Resolve Gradle dependency license metadata
        working-directory: app/android
        run: |
          ./gradlew --no-configuration-cache -I ../../tools/gradle_license_report.init.gradle \
            :app:writeDependencyLicenseReport "-PlicenseReport=$RUNNER_TEMP/gradle-licenses.json"
      - name: Check Gradle dependency licenses
        run: python3 tools/check_dependency_licenses.py gradle "$RUNNER_TEMP/gradle-licenses.json"
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  pdfium-bindings:
    name: PDFium bindings up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - name: Install libclang (needed by ffigen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - run: tools/fetch_pdfium.sh linux
      - run: flutter pub get
      - name: Regenerate bindings
        working-directory: packages/pdfium_ffi
        run: dart run tool/ffigen.dart
      - name: Fail if the generated bindings differ from the committed ones
        run: |
          git diff --exit-code -- packages/pdfium_ffi/lib/src/pdfium_bindings.g.dart || {
            echo "::error::pdfium_bindings.g.dart is out of date. Run 'dart run tool/ffigen.dart' in packages/pdfium_ffi and commit the result."
            exit 1
          }
