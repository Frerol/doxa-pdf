# SPDX-License-Identifier: GPL-3.0-or-later
# Signed per-ABI APKs, a CycloneDX SBOM and a draft GitHub Release for each `v*` tag
# (docs/plan/07-build-release.md §4). The maintainer reviews the draft, runs
# the release checklist on the reference tablet and publishes it by hand.
#
# Repository secrets (set by the maintainer):
#   DOXA_RELEASE_KEYSTORE_BASE64  the upload keystore, base64-encoded
#   DOXA_RELEASE_STORE_PASSWORD   its store password
#   DOXA_RELEASE_KEY_ALIAS        the key alias
#   DOXA_RELEASE_KEY_PASSWORD     the key password

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Signed Android APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag names the app version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/version_code.py --check --tag "$TAG"
          version="${TAG#v}"
          {
            echo "version=$version"
            echo "code=$(python3 tools/version_code.py "$version")"
            if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"
      - name: Read pinned Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          # No cache: a release is built from a clean toolchain.
          cache: false
      - name: Fetch Android PDFium
        run: tools/fetch_pdfium.sh android
      - name: Install the pinned Android SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'ndk;28.2.13676358'
      - name: Write the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DOXA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The DOXA_RELEASE_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Build signed per-ABI APKs
        working-directory: app
        env:
          DOXA_REQUIRE_RELEASE_SIGNING: 'true'
          DOXA_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          DOXA_RELEASE_STORE_PASSWORD: ${{ secrets.DOXA_RELEASE_STORE_PASSWORD }}
          DOXA_RELEASE_KEY_ALIAS: ${{ secrets.DOXA_RELEASE_KEY_ALIAS }}
          DOXA_RELEASE_KEY_PASSWORD: ${{ secrets.DOXA_RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi
      - name: Remove the release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - name: Check release dependency licenses and write the SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd app && flutter pub deps --json > "$RUNNER_TEMP/pub-deps.json")
          (cd app/android && ./gradlew --no-configuration-cache -I ../../tools/gradle_license_report.init.gradle \
            :app:writeDependencyLicenseReport -PlicenseReportConfigurations=releaseRuntimeClasspath \
            "-PlicenseReport=$RUNNER_TEMP/gradle-release.json")
          python3 tools/check_dependency_licenses.py pub
          python3 tools/check_dependency_licenses.py gradle "$RUNNER_TEMP/gradle-release.json"
          mkdir -p dist
          python3 tools/generate_sbom.py --version "$VERSION" --pub-deps "$RUNNER_TEMP/pub-deps.json" \
            --gradle-report "$RUNNER_TEMP/gradle-release.json" --output "dist/doxa-pdf-$VERSION.cdx.json"
      - name: Verify, rename and checksum the APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            certs="$("$build_tools/apksigner" verify --print-certs "$apk")"
            if grep -q 'CN=Android Debug' <<<"$certs"; then
              echo "::error::$apk is signed with the debug key."
              exit 1
            fi
            badging="$("$build_tools/aapt2" dump badging "$apk" | head -n 1)"
            grep -q "versionCode='$CODE'" <<<"$badging" || { echo "::error::$apk: $badging (expected versionCode $CODE)"; exit 1; }
            grep -q "versionName='$VERSION'" <<<"$badging" || { echo "::error::$apk: $badging (expected versionName $VERSION)"; exit 1; }
            cp "$apk" "dist/doxa-pdf-$VERSION-$abi.apk"
          done
          (cd dist && sha256sum -- *.apk *.cdx.json > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "Doxa PDF $VERSION")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" dist/*
