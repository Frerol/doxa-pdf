name: doxa_pdf
description: Free and open-source PDF reader for studying.
publish_to: none
version: 0.0.1+1
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  doxa_core: ^0.0.1
  doxa_dict: ^0.0.1
  doxa_engine: ^0.0.1
  doxa_ink: ^0.0.1
  doxa_platform: ^0.0.1
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.1.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/doxa-glyph.png
