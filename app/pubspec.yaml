name: doxa_pdf
description: Free and open-source PDF reader for studying.
publish_to: none
# The build number is the Android versionCode, derived from the version by
# tools/version_code.py (docs/plan/07-build-release.md §4).
version: 1.0.0-alpha.1+10000110
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  doxa_core: ^0.0.1
  doxa_dict: ^0.0.1
  doxa_engine: ^0.0.1
  doxa_ink: ^0.0.1
  doxa_platform: ^0.0.1
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.1.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/doxa-glyph.png
    - assets/fonts/Manrope-OFL.txt
    # Links to the license directory populated by tools/fetch_pdfium.sh.
    - assets/pdfium-licenses/
  # The interface font (docs/plan/05-ux-design.md §5); source and licence in
  # assets/fonts/README.md.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
